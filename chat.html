<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数字人对话 | 湖北社科数据信息联盟</title>
<link rel="stylesheet" href="./h5v2/tokens.css">
<link rel="stylesheet" href="./h5v2/base.css">
<style>
/* ==========================================================================
   对话页 · Companion-Chat —— 见 h5v2/DESIGN.md §4.2
   骨架：顶栏（44px 形象小头像 + 会话标题 + 新建 / 历史两个动作）
         欢迎卡（仅空对话时）→ 对话流
         底部输入条（两态：键盘 / 录音 —— 见 §5.1）→ AI 标识合规行

   整页滚动 + 顶栏/输入条 sticky，不写死高度（§4.2、§9）。
   首页形象位与对话页形象位是两个东西：这里用 .figure--dock（44px 圆头像）。
   本文件只写结构与页面级变体类，不改 base.css 的组件数值。
   ========================================================================== */

/* 会话标题：按顶栏中轴绝对定位。
   不放在 flex 流里居中 —— 左侧只有头像、右侧有两个动作，两侧不等宽，
   在「剩余空间」里居中会让标题整体偏左（320 下偏了 20px），不是屏幕中轴。
   脱流后由脚本量出两侧控件、取更宽的一侧做对称留白（--title-w），才是真居中。

   宽度必须只由布局决定、与文本长短无关，这是 fitTitle 二分的支点：
   所以这里写死 width，而不是 auto / max-content。
   居中态下 CSS 的 text-overflow 靠不住（省略号画在盒外、开头被无声吃掉），
   真正截几个字交给 fitTitle；这里保留 overflow/text-overflow 只作兜底。 */
.docpage__title {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: var(--title-w, 0);
  font-size: var(--text-md);
  font-weight: var(--w-head);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 顶栏两个动作都不参与伸缩，宽度各自固定，高度各由组件决定：
   新建钮是 .iconbtn--sm、历史是 .pill，两者都取 --h-pill（36px），天然同高。
   间距直接用 .docpage__bar 的 gap（--sp-sm），不额外加 margin ——
   margin 是叠在 flex gap 之上的，加了反而把顶栏撑松。
   标题脱流后，剩下头像 + 两个动作三个控件——用 auto margin 把它们分开：
   头像是第一个、跟着左内边距；这对动作被推到最右。 */
.acct-entry { margin-right: auto; }
.docpage__new,
.docpage__hist { flex: 0 0 auto; }

/* ≤768：历史收成纯图标圆钮，与左侧「新建对话」同款同尺寸。
   窄屏两个文字动作（标题 + 历史）会互相挤，标题只能显示几个字；
   图标形式的「历史」与它左边的圆形「新建」本来就该是一套。
   圆形用 --h-pill(36px) 正方 + --r-pill，与 .iconbtn--sm 完全对齐；
   图标尺寸在 base.css 里已由 .pill.docpage__hist svg 定为 20px。 */
@media (max-width: 768px) {
  .docpage__hist-txt { display: none; }
  .pill.docpage__hist {
    width: var(--h-pill);
    height: var(--h-pill);
    padding: 0;
    justify-content: center;
  }
}

/* 历史胶囊：主色调 + 与左侧「新建对话」图标钮同尺寸的图标与文字。
   · color：.pill 基类默认是 --ink-2（次级文字的灰），那是给「切换形象」这类
     中性动作的；「历史」在本页是通往另一页的主要出口，用品牌色点出来。
     图标走 currentColor，改一处 color 图标与文字一起变。
   · svg：基类 14px 是为纯文字胶囊配的小图标，比左侧图标钮的 20px 小一圈，
     并排像两个不同层级的控件。这里对齐到 20px。
   · 文字：跟着图标一起提，用 --text-base 16px —— 这是正文下限，也是
     节奏上离 20 最近的一级。体系的字号是单一比例（13/16/18/22/28），
     没有 20px 这一级，所以「文字与 20px 图标等大」不能照字面做；
     1.25 的图标:文字比本来就是标签配图标的常态。
   选择器都写成复合形式（.pill.docpage__hist）：与基类特异性相同时靠加载顺序
   取胜太依赖文件顺序，复合选择器更稳。 */
.pill.docpage__hist { color: var(--brand); font-size: var(--text-base); }
.pill.docpage__hist svg { width: 20px; height: 20px; }

/* 去掉悬停下划线。base.css 给所有 a:hover 加了 underline，那是给正文链接的；
   这里是按钮形态的胶囊，与顶栏「新建」图标钮属于同一组动作，加下划线不合体。
   含 :hover 是为了与 a:hover 特异性持平（0,2,0 vs 0,2,0），靠加载顺序取胜即可
   —— 页面样式表在 base.css 之后引入；再叠一层 :hover 也好写。 */
.pill.docpage__hist,
.pill.docpage__hist:hover { text-decoration: none; }

/* 对话流容器：气泡纵向栈。base.css 有气泡本身，缺一个栈 */
.docpage__flow { gap: var(--sp-md); }

/* 细滚动条。两套写法都要给：
   · scrollbar-width / scrollbar-color 是标准属性（新版 Chromium / Gecko）
   · ::-webkit-scrollbar 是 WebKit / 旧 Chromium 的前缀写法（微信内核走这条）
   只写其中一套，另一套环境就会回到默认的粗滚动条。
   轨道透明 + 圆角滑块：滚动条是辅助信息，不该在浅底上画出一条深灰硬边。 */
html {
  scrollbar-width: thin;                       /* 标准：细 */
  scrollbar-color: var(--line) transparent;    /* 滑块 / 轨道 */
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: var(--r-pill);
}
/* 手指按住滚动条时加深一点，给出「抓到了」的反馈 */
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

/* 欢迎卡的上下留白。
   上边距不是「好看」，是功能性的：卡内形象头顶越出卡片上沿约 20px，
   而卡片离 sticky 顶栏本来只有 flow 的 16px padding-top —— 不让位的话
   头顶会被顶栏盖住。给足一整档 --sp-lg(24px)，把越出的部分连同安全余量
   一起让出来。
   下边距是卡片与对话流的间距（原先是 chips 撑开的，chips 已移除）。 */
.herocard { margin-top: var(--sp-lg); margin-bottom: var(--sp-md); }

/* ==========================================================================
   手机段（<768）：形象占卡片高约 70%
   ==========================================================================
   占比是**自指**的：形象越大 → 文字列越窄 → 标题折行越多 → 卡片越高 →
   占比又被拉回去。所以不能按公式解，要按实测的收敛点定（实测见下）。

   「占 70%」的收敛点（形象宽 / 卡片高）：
     视口   形象    标题行数   卡片高
     320    158px      4       220
     375    134px      3       191
     414    140px      3       201
   （320 是实测取的 158px；用 clamp 在 375/414 收敛到 134/140。）

   **与「标题 ≤2 行」互斥。** 2 行时形象上限只到 51%/60%/65%，
   要到 70% 窄屏必然 3~4 行。本页取占比优先 —— 这是用户明确的选择。
   代价：320 下标题 4 行，卡片从 155px 涨到 220px。

   **字号必须同步放大，否则占比不成立。** 字号由「卡片高 / 3.2」反推
   （320→68.7px→21.5px，375→59.7px→18.7px，414→62.8px→19.6px）——
   形象变大而字号不动的话，卡片高度涨得比形象慢，占比永远到不了 70%。
   卡在 §3 的 16px 下限之上，不破规矩。

   注意：量行数要用 Range.getClientRects()，别用 scrollHeight / lineHeight ——
   任何 min-height 都会把 scrollHeight 抬高，行数会被算多（本页踩过一次）。 */
/* ≤375：不显示数字人形象，只留「文字 + 提示词」。
   窄屏本来就被形象挤到标题折 3~4 行、卡片涨到 220px，而形象只占右上一角，
   性价比是负的 —— 直接让位比继续挤更好。 */
@media (max-width: 375px) {
  .herocard__figure { display: none; }
  .herocard__body { padding-right: 0; }
}

/* 文字块压在形象之上：形象是绝对定位、且在 DOM 里排在正文之后，
   两者若因字号放大而擦碰，默认会由形象盖住文字。给文字一个更高层，
   文字永远在上（base.css 里 .herocard__body 已是 position: relative）。 */
.herocard__body { z-index: 1; }

@media (max-width: 767.98px) {
  /* 标题字号：从 530px 往下开始递减，让「把字缩到放得下」先于「折行」发生。
     原先的 clamp 在 414px 就撞到上限 22px 被锁死，而那一段可用宽只有 191px
     —— 字号不动、宽度不够，414~530 只能折 3 行，是整条曲线上唯一的死区。

     系数由实测反推，不是拍脑袋：逐个视口二分出「保持 2 行的最大字号」，
     415px 以上该曲线对可用宽近乎线性（字号 ≈ 0.0734×可用宽 − 0.14），
     再代入可用宽 = 0.916×视口宽 − 185（扣掉左右留白、卡内边距与形象位）
     得到 6.723vw − 13.72px。实测吻合到 0.2px 以内。

     两处硬边界，别再往下压：
     · 上限仍是 --text-lg(22px)：530px 以上本来就有富余，没必要继续放大。
     · 下限 16px 是 §3 的正文下限。曲线在 442px 触底 —— 这就是「2 行」的
       几何下限（16px 下两行至少需要约 311px 可用宽）。442 以下再怎么压都
       放不下 2 行，所以那里不该跟着这条曲线继续缩，见下面 ≤375 的还原规则。
     量行数请继续用 Range.getClientRects()，别用 scrollHeight（见上）。 */
  .herocard__title { font-size: clamp(16px, calc(6.723vw - 13.72px), var(--text-lg)); }

  /* 窄屏把左右内边距收到 --sp-md，给「标题 2 行」留出余量：
     原来 320px 下可用宽 160px，而 16px 字号恰好需要 160px ——
     卡在临界点上，亚像素取整就可能溢出成 3 行。 */
  .herocard { padding-inline: var(--sp-md); }
}

/* ≤375 的标题字号还原。
   必须排在上面那条 767.98 媒体查询**之后** —— 两条查询同特异度，
   后写的胜出，放在前面会被 6.723vw 那条静默盖掉（本页踩过一次）。

   为什么不跟新曲线：形象在这个区间已隐藏，标题能吃满整卡宽（375 下有 311px），
   本来 19.5px 就排得下 2 行；新曲线是按「有形象占位」算的，会把它压到 16px —— 白缩。
   旧式 clamp(16px, -4.4px+6.38vw, 22px) 在 320~375 全程都不足 2 行所需，
   即这段范围内它只会给 2 行，沿用旧值等于「面积不变、字号复原」。
   别顺手把它也改成新曲线。 */
@media (max-width: 375px) {
  .herocard__title { font-size: clamp(16px, calc(-4.4px + 6.38vw), var(--text-lg)); }
}

/* ==========================================================================
   提示词位（空态欢迎卡内）—— 单行，像广告条那样上下滚动换词
   ==========================================================================
   放在 .herocard__body 里，左对齐、宽度受右形象约束，与上面的标题同一条竖线。

   这里没有用 base.css 的 .chips/.chip：
   那是横排多个可滑的标签，与「一次只露一条、自动轮换」是两种东西。
   也没有用 .marquee 之类：轮换的是**整条**提示词（步进），不是字符流。 */

/* 窗口：只露一行，多出来的裁掉。
   高度由脚本按「一行真实高度」写进来，不在这里定死 —— 微信字体档位放大后
   一行会变高，CSS 里写死就会把字裁掉。 */
.prompts {
  /* 与上方内容的间距由 .herocard 的 gap(--sp-sm) 给，这里只补一点，
     让提示词与标题之间比「标题到说明」略松，形成一层分隔。 */
  margin-top: var(--sp-2xs);
  overflow: hidden;
}

/* 轨道：三档纵排，整体上下平移换档。
   只动 transform（§8）—— 位移 height/margin 会触发布局，是禁止项。 */
.prompts__track {
  display: flex;
  flex-direction: column;
  transition: transform var(--dur-short) var(--ease-out);
}
.prompts[data-no-anim] .prompts__track { transition: none; }

/* 单条：本身是 button（可聚焦、可点、语义正确），样式降到接近文字。
   图标 + 文字两列，纵向居中。
   纵向不设固定高，让大字号档位下自然长高 —— 定死高会在微信大字号下裁字。
   ——但它的行高会被脚本量出来写进 .prompts 的高度，两处要一致。 */
.prompt {
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  width: 100%;
  padding: var(--sp-2xs) 0;
  text-align: left;
  /* --text-xs 13px，与 base.css 的 .chip 同一档。
     这一栏的可用宽被右侧形象压到 195px 左右（375 视口），用 16px 正文
     一条 16 字的提示词会被截掉四成 —— 而提示词是给用户念的，
     念不全就失去了「给个起手式」的意义。降一档后三条都能完整显示。 */
  font-size: var(--text-xs);
  color: var(--brand);
  /* 当前档之外压色。位置差异由轨道滑动给足，不必再缩小字号 ——
     缩小会让同一段文字在不同档位看起来字号不同，与字号级别固定的规矩相冲。 */
  opacity: .4;
  transition: opacity var(--dur-short) var(--ease-out),
              transform var(--dur-micro) var(--ease-out);
}
.prompt[data-active="true"] { opacity: 1; }
.prompt:active { transform: translateY(1px); }

/* 图标：气泡 + 问号，说明「这是一句可以问的话」。
   flex 项默认会压缩，必须 flex:none —— 否则窄屏下图标先被压扁，
   而它正是这条内容里最需要保住的部分。 */
.prompt__ico {
  flex: none;
  width: 16px; height: 16px;
  /* 与文字同色，靠 currentColor 跟着 .prompt 的 color / opacity 走，
     不必另写颜色，也不会在非当前档时与文字深浅不一。 */
  stroke: currentColor;
}

/* 文字：唯一的可伸缩项，截断发生在这里。
   截断必须落在文字上而不是 .prompt 上 —— 否则省略号会盖住图标。 */
.prompt__txt {
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 输入条不再是页面最底部的元素（AI 标识在它下面），
   所以 base.css 里那份 --pad-bottom 成了死间距 —— 它原本负责「别被 iPhone 小黑条
   和 iOS 微信底栏盖住」，那个职责已经转移给下面的 .docpage__aiflag。
   下内边距归零：输入框与标识之间的空隙由 .aiflag 自己的上内边距单独控制，
   两处都给值就会叠成一段说不清来历的空白。 */
.docpage__foot .composer { padding-bottom: 0; }

/* AI 标识坐落在输入条下方、水平居中（.aiflag 自带 text-align:center）。
   文字要落在「输入框 ↔ 页底」之间，所以上下都留出空隙；
   但两段空隙之和必须等于原来的 12px（--sp-sm），否则这个盒子会变高/变矮，
   而它变高就会把上面的输入条顶上去 —— 输入框的位置是要保持不动的。
   因此这里是「把下方的一段挪一部分到上方」，不是加间距：
   --sp-2xs(4) 在上、--sp-xs(8) 在下，和仍是 12，输入框原地不动，文字上移 4px。 */
.docpage__aiflag {
  padding-top: var(--sp-2xs);
  padding-bottom: calc(var(--sp-xs) + var(--safe-bottom));
}

/* ==========================================================================
   顶栏 · 用户头像入口
   ==========================================================================
   .figure--dock 本来是「数字人缩成 44px 圆头像」的容器，这里复用它做用户头像：
   形状（44px 圆、--brand-soft 底）正是头像要的，不必另造一个类。
   里面装的是默认头像图形 —— 演示站没接微信授权，拿不到真实用户头像。

   接微信体系时把这里换成一个 <img>（src 取授权返回的头像），其余不动。 */
.acct-entry {
  display: grid;
  place-items: center;
  color: var(--brand);
  flex: 0 0 auto;
  /* 背景与顶栏那两个按钮一致（.iconbtn 是 --surface 白底 + 投影）——
     顶部一左两右三件都是「可点的圆钮」，底色该是一套；
     .figure--dock 基类的 --brand-soft 是给「形象缩略图」用的，对头像偏灰不显眼。
     只改顶栏这一处，账户页里的头像仍用 --brand-soft（见 account.html）。 */
  background: var(--surface);
  box-shadow: var(--sh-btn);
}
/* 图标尺寸挂元素选择器，不另起类名 —— 这个头像位只会有一个 svg，
   多一个 .acct-entry__ico 只是多一个要维护的名字。 */
.acct-entry svg { width: 24px; height: 24px; }
.acct-entry:active { transform: translateY(1px); }

/* 头像不加任何滤镜。
   深色模式下 base.css 会给形象类图片上 brightness/contrast 提亮，那是给
   数字人插画调的；用户头像是真实照片，被提亮会失真、也认不出本人。
   这里把它按平，将来换成 <img> 真实微信头像时同样受益。 */
.acct-entry,
.acct-entry img,
.acct-entry svg { filter: none; }

/* 头像是「用户」，此前挂的是数字人形象（`头像 = 助手`），语义错了，
   现已换成默认人头图形。相关说明见 markup 处注释。 */

/* 输入框在空态时给一句占位说明，说明可以问什么（§7 文案） */
.composer__field input::placeholder { color: var(--ink-3); }

/* 来源行：文字与播报钮同行，钮贴右端。
   base.css 的 .bubble__src 是 display:block，直接用会把钮挤到下一行 ——
   这里改成 flex，文字占满剩余宽度、钮固定不动。
   用复合选择器而不是单类名覆写：base.css 那条特异性相同且在更前面，
   但真正会赢的是「同特异性下更靠后」的规则 —— 本页样式表在 base.css 之后，
   所以单类名本来也能赢；写全两层是为了让「我在覆写哪条」一眼可查。 */
.bubble--ai .bubble__src {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-sm);
}
/* 播报钮在来源行里比 36px 再收一档：它挂在一行 13px 的小字旁边，
   36px 的圆会把这行读成「一个按钮 + 一行附注」。28px 仍够放 20px 图标，
   热区由 .speakbtn::before 撑到 44px，不受影响。 */
.bubble__src .speakbtn {
  width: 28px;
  height: 28px;
}
.bubble__src .speakbtn::before { inset: -8px; }   /* 28 + 8×2 = 44 热区 */
.bubble__src .speakbtn svg { width: 17px; height: 17px; }
</style>
</head>
<body>

<div class="docpage">

  <!-- 顶栏：左端是**用户头像**，不是数字人形象 —— 两者常被混淆，说明一下：
       数字人形象属于「助手」，先前那版把它缩成 44px 挂在顶栏，语义是错的。
       这里真实场景取微信授权后的用户头像；演示站没接微信体系，
       所以统一用默认头像占位（非微信浏览器访问时也用它）。
       非微信端不可修改头像，点它进账户页。 -->
  <header class="docpage__bar">
    <a class="figure figure--dock acct-entry" id="btn-account"
       href="./account.html?from=chat" aria-label="我的账户">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8.6" r="3.9"/>
        <path d="M4.6 20.2a7.4 7.4 0 0 1 14.8 0"/></svg>
    </a>
    <h1 class="docpage__title" id="conv-title">新对话</h1>

    <!-- 先清空会话再跳，否则在已有会话里点它等于原地不动
         （标题由首条提问决定，跳回同一 URL 还是那条会话）。
         留 href 兜底：脚本没跑起来时它仍是一个可用的「回对话页」链接。 -->
    <a class="iconbtn iconbtn--sm docpage__new" href="./chat.html" id="btn-new"
       aria-label="新建对话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/></svg>
    </a>

    <!-- from=chat 让历史页知道该返回到哪（见 history.html 的 readFrom） -->
    <a class="pill docpage__hist" href="./history.html?from=chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/>
        <path d="M12 8v4.5l3 1.8"/></svg>
      <!-- 文字单独包一层：窄屏要连同图标把整钮变成圆形，文字得能被单独藏起来
           （只靠 CSS 拿不到裸文本节点）。 -->
      <span class="docpage__hist-txt">历史</span>
    </a>
  </header>

  <main class="docpage__flow" id="flow">

    <!-- 空对话：用一张卡把「我是谁、能做什么、从哪开始」一次说清。
         一旦有了第一条消息，这张卡让位给对话流（§4.2）。
         「从哪开始」原来是一个「开始提问」按钮，现在换成提示词位 ——
         按钮只说了「可以问」，提示词直接给出「可以问什么」，还省掉一次点击。 -->
    <section class="herocard" id="welcome" aria-labelledby="welcome-title">
      <div class="herocard__body">
        <p class="herocard__hi">湖北社科数据信息联盟</p>
        <!-- 主语与谓语分行。用 <br> 而不是把宽度写死 —— 标签是两段固定文案，
             分行是内容结构而非断行结果，写死 width 会在字号档位变化时错位。 -->
        <h2 class="herocard__title" id="welcome-title">
          智库报告 / 学术论文 / 政策解读<br>都可以问我
        </h2>

      </div>
      <div class="herocard__figure">
        <img class="figure__img" data-avatar-img src="./h5v2/assets/avatars/avatar-01.png"
             alt="数字人形象" width="120" height="120" loading="lazy" decoding="async">
      </div>

      <!-- 提示词位：单行、上下滚动换词，内容是脚本填的（PROMPTS）。
           用 .herocard__wide 占满整卡宽度 —— 挤在 __body 里会被右侧形象
           分走一半宽（375 视口下只剩 163px），一条完整的提示词放不下。 -->
      <div class="herocard__wide prompts" id="prompts" role="group" aria-label="试试这样问">
        <div class="prompts__track" id="prompt-track"></div>
      </div>
    </section>

    <!-- 对话流：有消息后由脚本填充 -->
    <div class="stack" id="thread"></div>

  </main>

  <!-- 底部：输入条 + AI 标识（合规必现）。
       sticky 吸底，输入框聚焦时自动滚到键盘之上（base.css 的 scroll-margin-block）。 -->
  <footer class="docpage__foot">

    <!-- 输入条（DESIGN.md §5.1）：左钮切模式，右侧随模式换形态。
         键盘态 = 输入框 + 发送钮；录音态 = 录音按钮。
         原先只靠 enterkeyhint="send" 用系统键盘发送、不设发送钮；
         发送钮补上后，生成中还能原地变成「停止」—— 系统键盘给不了这个能力。
         回车 / 系统「发送」键仍然照常提交，两条路不冲突。 -->
    <div class="composer" id="composer" data-mode="keyboard">
      <!-- 左：模式切换。图标表「当前模式」，动作由 aria-label 说明 -->
      <button class="iconbtn composer__mode" type="button" id="btn-mode" data-mode-toggle>
        <svg class="i-keyboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="5.5" width="19" height="13" rx="2.6"/>
          <path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
        <svg class="i-voice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>

      <!-- 右 · 键盘态。发送钮放在输入框**内部**最右（不是外面并排）——
           读作「这条输入的操作」，与左侧模式钮那个独立方块不是一类东西。
           三态见 base.css 的 .composer__send：无 data-send = 置灰箭头不可点；
           ready = 点亮；stop = 实心方块可停止。初始 disabled，由脚本切换。 -->
      <div class="composer__field">
        <label class="sr-only" for="composer-input">输入你的问题</label>
        <input id="composer-input" type="text" inputmode="search" enterkeyhint="send"
               autocomplete="off" placeholder="输入你的问题">
        <button class="iconbtn composer__send" type="button" id="btn-send" disabled
                aria-label="发送">
          <svg class="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="2.4" fill="currentColor"/></svg>
        </button>
      </div>

      <!-- 右 · 录音态 -->
      <button class="composer__rec" type="button" id="btn-rec" data-rec="off" data-rec-btn
              aria-pressed="false">点击开始录音</button>
    </div>

    <!-- AI 标识（合规必现，§4.2 / §5）。放在输入条下方而不是上方：
         它是输入区的注脚（「你输入的内容会怎样被回答」），贴着输入条更好读；
         夹在对话流与输入条之间会把它读成对话流的一部分。
         base.css 的 .aiflag 已是 text-align:center，这里只需补下安全区的呼吸。 -->
    <p class="aiflag docpage__aiflag">内容由 AI 生成，请注意甄别</p>
  </footer>

</div>

<!-- 反馈条：与首页同一个组件、同一套位置（base.css 的 .toast 已统一走顶部）。
     本页原先没有 toast，登录成功等「结果不可见」的提示需要它。 -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="./auth.js"></script>
<script>
(function () {
  'use strict';

  /* ======================================================================
     对话页 · 空态优先
     本轮只做「新建对话的空状态」：欢迎卡 + 输入条。
     但两个入口（首页键盘钮、录音转写弹窗的发送）都会带 ?q= 过来，
     所以也把「有 q 时作为首条消息发出去」这条路径做通，
     否则用户确认过的文字会被丢掉。

     真实模型调用不在本轮范围：AI 回答是演示数据，
     走 .bubble--typing 短暂态再出答案，把「生成中」这一态也演示出来。
     ====================================================================== */

  /* 回答正文与「念出来的文本」分开：
     正文是 HTML（含来源行与播报钮），TTS 只该念纯文字，
     否则会把「来源：社科专家成果库」连同标点一起读进语音里。
     两者放一起维护，避免改了一处忘了另一处。 */
  var DEMO_ANSWER_TEXT = '已按「智库报告 / 学术论文 / 政策解读」分类梳理，共 47 条。';
  var DEMO_ANSWER_SRC = '来源：社科专家成果库';

  /* 播报钮：两态圆钮，图标表「按下去会得到什么」——
     默认喇叭（点了开始播），播报中换停止方块（点了停下），与输入条发送钮同一套语义。 */
  var SPEAK_ICO_PLAY =
    '<svg class="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M11 5.5 6.5 9.5H3.5v5h3L11 18.5z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/>'
    + '<path d="M18.2 6.5a7.6 7.6 0 0 1 0 11"/></svg>';

  var TYPING_MS = 900;   /* 演示：生成中耗时 */

  var flow = document.getElementById('flow');
  var thread = document.getElementById('thread');
  var welcome = document.getElementById('welcome');
  var title = document.getElementById('conv-title');
  var input = document.getElementById('composer-input');
  var composer = document.getElementById('composer');
  var modeBtn = document.getElementById('btn-mode');
  var recBtn = document.getElementById('btn-rec');
  var sendBtn = document.getElementById('btn-send');

  /* ----------------------------------------------------------------------
     数字人形象与首页保持同一个人
     首页「切换形象」把序号写进 localStorage 的 skl.avatar，
     这里读回来替换**欢迎卡**里的形象。
     顶栏那个圆头像不在此列 —— 那是用户头像，与数字人无关（见顶栏注释）。
     键名与下标顺序必须与首页 AVATARS 一致，改一边就要改另一边。
     ---------------------------------------------------------------------- */
  var AVATAR_KEY = 'skl.avatar';
  /* 下标 0 是默认形象 —— 女性。顺序必须与首页 index.html 的 AVATARS 逐位一致：
     首页把序号写进 localStorage，这里按同一个序号读回来。 */
  var AVATAR_SRC = [
    './h5v2/assets/avatars/avatar-01.png',   /* 0 · 女性，白衬衫（默认） */
    './h5v2/assets/avatars/avatar-02.png'    /* 1 · 男性，蓝衬衫 */
  ];

  (function applySharedAvatar() {
    var i;
    try {
      i = parseInt(localStorage.getItem(AVATAR_KEY), 10);
    } catch (err) { i = 0; }
    if (!(i >= 0 && i < AVATAR_SRC.length)) i = 0;
    document.querySelectorAll('[data-avatar-img]').forEach(function (el) {
      el.src = AVATAR_SRC[i];
    });
  })();

  /* ----------------------------------------------------------------------
     提示词位 —— 单行窗口，逐条滑出 / 滑入，像广告条那样上下翻
     ----------------------------------------------------------------------
     为什么不是「摊开三条」：这是在给用户递第一句话，一次只给一条，
     看完一条心里就有个起手式；同时摊开三条反而要先挑，又变成选择题。

     做法是最朴素的那种：窗口只露一行；每 N 秒把**当前那条往上滑出去**，
     动画结束后移除它，同时**把下一条从下方滑进来**。轨道里始终只有两条，
     不用拼接长轨、不用算环形下标、也不用担心接缝（那些方案的复杂度
     在只有三条文案时完全不值）。

     接真实推荐接口时替换 PROMPTS 一处即可，轮播逻辑不动。
     ---------------------------------------------------------------------- */
  /* 文案长度受这一栏的窄宽度约束（375 视口下约 195px），别再写长 ——
     超出的部分会被省略号吃掉，而提示词被截断就失去了意义。 */
  var PROMPTS = [
    '长江经济带有哪些代表性研究成果？',
    '湖北有哪些重点社科智库？',
    '近五年湖北社科基金立项情况怎么样？'
  ];
  var PROMPT_MS = 3600;

  var promptsWrap = document.getElementById('prompts');
  var promptTrack = document.getElementById('prompt-track');
  var promptIdx = 0;
  var promptTimer = null;

  function buildPrompts() {
    if (!promptsWrap || !promptTrack || !PROMPTS.length) return;

    /* 顺序不能反：必须先插进 DOM 再量高度。
       游离元素的 offsetHeight 只算得上 padding，量出来是个 8px 的假高度，
       窗口就会被压成一条线。 */
    promptTrack.appendChild(makePrompt(PROMPTS[0], true));
    syncPromptHeight();

    /* 只在空态轮播。首条消息进来时欢迎卡整体移除，enterConversation 会清定时器。 */
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      /* 降低动态偏好：不自动翻，但那条仍然可点，用户照样能拿到一个起手式 */
      return;
    }
    promptTimer = setInterval(advancePrompt, PROMPT_MS);
  }

  /* 气泡 + 问号：说明「这是一句可以问的话」。
     不是装饰性图形 —— 它承载「这条是可提问的」这个信息（§11 禁止无意义图形）。
     aria-hidden：右侧文字本身就是完整的问题，读屏不需要再听一个图标。 */
  var PROMPT_ICO =
    '<svg class="prompt__ico" viewBox="0 0 24 24" fill="none" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    /* 气泡：左右对称的圆角体 + 左下角小尾巴 */
    '<path d="M20.5 11c0 4.2-3.8 7.6-8.5 7.6-.9 0-1.8-.1-2.6-.4L5.5 20.5l.6-3.2C4.7 16.1 3.5 13.7 3.5 11 3.5 6.8 7.3 3.4 12 3.4s8.5 3.4 8.5 7.6Z"/>' +
    /* 问号 */
    '<path d="M10.3 9.2a1.9 1.9 0 0 1 3.7.5c0 1.2-1.8 1.5-1.8 2.7"/>' +
    '<path d="M12.2 15.2h.01"/></svg>';

  function makePrompt(text, active) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'prompt';
    if (active) b.setAttribute('data-active', 'true');

    /* 图标与文字分两个节点：截断要落在文字上，否则省略号会盖住图标。
       文字用 textContent 落字、不拼进 innerHTML —— 提示词将来可能来自接口。 */
    b.innerHTML = PROMPT_ICO;
    var txt = document.createElement('span');
    txt.className = 'prompt__txt';
    txt.textContent = text;
    b.appendChild(txt);

    /* 提示词写全，读屏直接念出「要问什么」，不需要「第 N 条」这类补语 */
    b.addEventListener('click', function () { pickPrompt(text); });
    return b;
  }

  /* 窗口高 = 一条的真实高度。量出来而不是在 CSS 里写死：
     微信字体档位放大后一行会变高，写死会把字裁掉。
     调用前那条必须在 DOM 里，否则量到的是假的。 */
  function syncPromptHeight() {
    var first = promptTrack.querySelector('.prompt');
    if (!first) return;
    var h = first.offsetHeight;
    promptTrack.style.height = h + 'px';
    promptsWrap.style.height = h + 'px';
    return h;
  }

  /* 一次换档 = 旧的上滑走 + 新的从下滑来，两者同时进行。
     方向恒定向下翻（内容往上走），不做来回 —— 反弹会让人以为界面在抖。 */
  function advancePrompt() {
    var cur = promptTrack.querySelector('.prompt[data-active="true"]') ||
              promptTrack.firstElementChild;
    if (!cur) return;

    promptIdx = (promptIdx + 1) % PROMPTS.length;
    var next = makePrompt(PROMPTS[promptIdx], false);

    /* 入场位：先落在窗口下方，再过渡到 0 */
    next.style.transition = 'none';
    next.style.transform = 'translateY(100%)';
    promptTrack.appendChild(next);
    void next.offsetHeight;                    /* 强制回流，让起始位置生效 */

    next.style.transition = '';
    next.style.transform = 'translateY(0)';
    cur.style.transform = 'translateY(-100%)';
    cur.removeAttribute('data-active');
    next.setAttribute('data-active', 'true');

    /* 动画走完再清场，把轨道恢复成「只有一条」的干净状态 */
    setTimeout(function () {
      if (cur.parentNode) cur.parentNode.removeChild(cur);
      next.style.transform = '';
    }, 260);                                   /* 略大于 --dur-short(220ms) */
  }

  /* 点提示词：只填入输入框，不直接发送 —— 用户常常想改一两个字再问。
     发出去就收不回来了，填进去还能改。光标给到末尾，接着打字即可。 */
  function pickPrompt(text) {
    if (mode !== 'keyboard') { mode = 'keyboard'; renderComposer(); }
    input.value = text;
    /* 脚本赋值**不触发** input 事件，发送钮的可用态就同步不过去 ——
       点完提示词按钮还是灰的。这里手动刷一次（发送钮的唯一判据在 renderSend）。 */
    renderSend();
    input.focus();
    input.setSelectionRange(text.length, text.length);
  }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function scrollToEnd() {
    /* 新消息进来后滚到底。用最后一屏高度对齐，避免顶栏被顶出视线 */
    var last = thread.lastElementChild;
    if (last) last.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }

  /* 首条消息落地后，欢迎卡让位给对话流（§4.2）。
     轮播定时器必须在这里停掉：卡片一移除，那三个 button 就成了游离节点，
     定时器还在跑就是纯粹的浪费（而且会一直持着它们的引用不放）。 */
  function enterConversation() {
    if (promptTimer) { clearInterval(promptTimer); promptTimer = null; }
    if (welcome) { welcome.remove(); welcome = null; }
    flow.setAttribute('aria-label', '对话内容');
  }

  /* 顶栏标题：先按中轴算可用宽度，再按宽度截断补省略号。
     两件事都必须在同一个函数里、按固定顺序做 ——
     宽度变了要重新截，截出来的字变了宽度不该跟着变（否则互相触发）。
     .docpage__title 写死了 width，所以「量宽度」不会因为换文本而失效。

     可用宽度取两侧更宽的一侧做对称留白：
     长的那侧决定中轴到该侧控件有多远，另一侧照抄这个距离，标题才是真居中。 */
  var barEl = document.querySelector('.docpage__bar');
  var acctEl = document.getElementById('btn-account');
  var newEl = document.getElementById('btn-new');
  var histEl = document.querySelector('.docpage__hist');

  function measureTitleWidth() {
    var barR = barEl.getBoundingClientRect();
    var cs = getComputedStyle(barEl);
    /* 两侧的「占位宽度」= 控件外沿到顶栏外沿的距离（含 padding 与 gap） */
    var left = acctEl.getBoundingClientRect().right - barR.left;
    var right = barR.right - newEl.getBoundingClientRect().left;
    var gap = parseFloat(cs.gap) || 0;
    /* 与标题至少隔一个 gap，否则字会贴上按钮 */
    var w = barR.width - 2 * Math.max(left, right) - 2 * gap;
    w = Math.max(0, Math.floor(w));
    /* 宽度写在 :root 上而不是 title.style.width：
       CSS 变量便于将来按视口再调，也让规则留在样式里。 */
    document.documentElement.style.setProperty('--title-w', w + 'px');
    return w;
  }

  function fitTitle(text) {
    var avail = measureTitleWidth();
    if (avail <= 0) return text;

    var canvas = fitTitle.canvas || (fitTitle.canvas = document.createElement('canvas'));
    var ctx = canvas.getContext('2d');
    var cs = getComputedStyle(title);
    ctx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;

    var ELL = '…';
    var w = function (s) { return ctx.measureText(s).width; };
    if (w(text) <= avail) return text;

    /* 二分而不是「总宽 ÷ 单字宽」：中英数混排时字符宽度不等。
       量的是 shape 推进宽，实际渲染还有取整误差，留 1px 余量。 */
    var lo = 0, hi = text.length;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (w(text.slice(0, mid) + ELL) <= avail - 1) lo = mid; else hi = mid - 1;
    }
    /* lo 为 0：连一个字加省略号都放不下（极窄屏），
       宁可让 CSS 去裁，也不要交出一个光秃秃的「…」。 */
    return lo > 0 ? text.slice(0, lo) + ELL : text;
  }

  function addUser(text) {
    thread.appendChild(el('p', 'bubble bubble--user', ''));
    thread.lastElementChild.textContent = text;
    /* 会话标题取首条提问 —— 与历史列表口径一致，长度交给宽度决定 */
    titleSrc = text;
    title.textContent = fitTitle(text);
  }

  /* ----------------------------------------------------------------------
     播报
     单一在播的回复 + 一处卡片，两边的按钮是同一份状态的两个视图。
     · 播报文本按回复存（bubble 的 dataset），点某条的钮就播某条；
     · 「停止后能重播」——stopSpeaking 只收状态，不清文本，所以再点即重播；
     · 「不打断」——发下一条消息不碰播放中的这条；旧播报自然念完转默认态。
     ---------------------------------------------------------------------- */
  var speaking = false;      /* 是否有播报在进行 */
  var speakingBubble = null; /* 正在播的那条 AI 气泡 */
  var speakTimer = null;     /* TTS 不可用时的兜底计时（按文字长度估时长） */

  /* 播报模拟时长：按字数估，中文约每字 0.22s，两端各留一点起停余量。
     仅在没有 speechSynthesis 时用（见 speak()）。 */
  function estimateMs(text) { return Math.max(1200, text.length * 220); }

  /* 播报态的**唯一**渲染出口：只有回复行里那枚钮随状态切。
     回复动态生成，所以每次全量刷新 —— 避免某条漏复位留下一个
     「按了没反应」的假播报态。 */
  function renderSpeak() {
    thread.querySelectorAll('.speakbtn[data-speak]').forEach(function (b) {
      var on = speaking && b.closest('.bubble--ai') === speakingBubble;
      b.toggleAttribute('data-speaking', on);
      b.setAttribute('aria-label', on ? '停止播报' : '播报本条回复');
    });
  }

  /* 开始播报某条 AI 气泡。text 为该条的纯文字（不含来源），由调用方给。 */
  function startSpeaking(bubble, text) {
    stopSpeaking();          /* 先收干净上一次，避免两套动效叠着 */
    speaking = true;
    speakingBubble = bubble;
    renderSpeak();

    if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }

    /* 真实 TTS：能用就用。微信内置浏览器对 speechSynthesis 支持不稳定，
       所以永远同时挂一个兜底计时器 —— 有 TTS 时它到点只是收状态
       （onend 会先一步清掉它），没 TTS 时它就是唯一的时间来源。
       两条路都收敛到 stopSpeaking，不留分叉。 */
    var tts = window.speechSynthesis;
    if (tts && typeof SpeechSynthesisUtterance === 'function') {
      try {
        tts.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.onend = stopSpeaking;
        u.onerror = stopSpeaking;   /* 被系统打断 / 不支持中文语音，都收状态 */
        tts.speak(u);
      } catch (e) { /* 落到下面的兜底计时器 */ }
    }

    speakTimer = setTimeout(stopSpeaking, estimateMs(text) + 400);
  }

  function stopSpeaking() {
    if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
    if (window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    /* 已经不在播就只做一次收尾，避免重复调用时把状态又翻一遍 */
    if (!speaking) return;
    speaking = false;
    speakingBubble = null;
    renderSpeak();
  }

  function toggleSpeaking(bubble, text) {
    if (speaking && speakingBubble === bubble) stopSpeaking();
    else startSpeaking(bubble, text);
  }

  /* 生成中的定时器要能被「停止」清掉，所以留在外面（原先是匿名 setTimeout） */
  var aiTimer = null;

  /* AI 气泡的完整结构：正文 + 来源行（含本条播报钮）。
     来源行里塞一个按钮，所以 .bubble__src 在本页被改成 flex（见页内样式）。 */
  function aiBubbleHTML() {
    return '<span class="bubble__text">' + DEMO_ANSWER_TEXT + '</span>'
         + '<span class="bubble__src"><span>' + DEMO_ANSWER_SRC + '</span>'
         + '<button class="speakbtn" type="button" data-speak aria-label="播报本条回复">'
         + SPEAK_ICO_PLAY
         + '</button></span>';
  }

  function addAi() {
    var typing = el('div', 'bubble bubble--ai bubble--typing',
                    '<i></i><i></i><i></i>');
    typing.setAttribute('aria-label', '正在生成回答');
    thread.appendChild(typing);
    scrollToEnd();

    aiTimer = setTimeout(function () {
      aiTimer = null;
      if (typing) {
        typing.classList.remove('bubble--typing');
        typing.removeAttribute('aria-label');
        typing.innerHTML = aiBubbleHTML();
        /* 回复完成即自动播报本条（用户明确要求）。
           stopAi 里已清掉 aiTimer 并 null，所以走这条路的 bubble 一定是完整回复。 */
        startSpeaking(typing, DEMO_ANSWER_TEXT);
      }
      busy = false;
      scrollToEnd();
      renderSend();
    }, TYPING_MS);
  }

  var busy = false;

  /* 发送钮三态。状态的唯一出口 —— 输入、发送、生成结束、停止、
     模式与登录态切换都调它，避免状态散在各处各自为政。
     停止态优先于输入内容：生成中即使输入框有字，按钮也该是「停止」，
     否则用户没法中断一个跑歪的回答。 */
  function renderSend() {
    var stop = busy;
    var ready = !stop && input.value.trim() !== '';
    var mode = composer.getAttribute('data-mode');
    /* 录音态没有键盘发送的语义，整钮收起（同 .composer__field 的处理）。
       hidden 写属性而不是 CSS 类：base.css 有 [hidden]{display:none!important}，
       能盖住 .iconbtn 的 display:grid。 */
    sendBtn.hidden = mode !== 'keyboard';
    sendBtn.disabled = stop ? false : !ready;
    if (stop) {
      sendBtn.setAttribute('data-send', 'stop');
      sendBtn.setAttribute('aria-label', '停止生成');
    } else {
      sendBtn.removeAttribute('data-send');
      if (ready) sendBtn.setAttribute('data-send', 'ready');
      sendBtn.setAttribute('aria-label', '发送');
    }
  }

  /* 停止生成：清掉定时器，把「正在生成」的气泡就地转成一句中断说明。
     不删气泡 —— 删除会让用户以为消息被撤销了；保留并说明才是「已停止」。
     已停止生成的说明里没有播报钮（也确实没内容可播），所以不触发播报。 */
  function stopAi() {
    if (!aiTimer) return;
    clearTimeout(aiTimer);
    aiTimer = null;
    busy = false;

    var typing = thread.lastElementChild;
    if (typing && typing.classList.contains('bubble--typing')) {
      typing.classList.remove('bubble--typing');
      typing.removeAttribute('aria-label');
      typing.textContent = '已停止生成';
    }
    /* 生成被打断时若正好有别的回复在播，保留 —— 用户要的是「不打断」 */
    renderSend();
  }

  /* 发送前确认身份。放在这里而不是各个入口（回车 / ?q=）分别拦：
     入口有三个，拦在共用的 send 上才不会漏。
     未登录时先弹登录层，**登录成功后自动把这条发出去** ——
     用户已经写完问题了，让 ta 登录完再点一次发送是多余的。 */
  function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;

    Auth.require(function () { doSend(text); });
  }

  function doSend(text) {
    busy = true;

    if (welcome) enterConversation();
    addUser(text);
    input.value = '';
    scrollToEnd();
    addAi();
    renderSend();
  }

  /* ---- 输入条 · 键盘态 ---- */
  input.addEventListener('keydown', function (e) {
    /* 系统键盘的「发送」键与回车都走这里 */
    if (e.key === 'Enter') { e.preventDefault(); send(input.value); }
  });

  /* 输入内容变化即时反映到发送钮的可用态。
     用 input 事件而不是 keydown：粘贴、输入法上屏、清空都覆盖得到。 */
  input.addEventListener('input', renderSend);

  /* 发送钮一个钮两种职责：生成中点击 = 停止，否则 = 发送。
     由 busy 分流，与 renderSend 的判据同源。 */
  sendBtn.addEventListener('click', function () {
    if (busy) stopAi();
    else send(input.value);
  });

  /* ---- 播报 · 两处按钮 ----
     事件委托到对话流：回复是脚本动态生成的，逐条绑监听会在每次 addAi
     之后多一批要维护的引用。委托只需绑一次，且天然覆盖将来新增的回复。 */
  thread.addEventListener('click', function (e) {
    var btn = e.target.closest('.speakbtn[data-speak]');
    if (!btn) return;
    var bubble = btn.closest('.bubble--ai');
    if (!bubble) return;
    /* 播报文本取该条正文节点，不带来源行 —— 来源是标注，不该念出来 */
    var textEl = bubble.querySelector('.bubble__text');
    toggleSpeaking(bubble, textEl ? textEl.textContent : bubble.textContent);
  });

  /* ----------------------------------------------------------------------
     输入条 · 两态三步骤（DESIGN.md §5.1）
     键盘态 ─点左─▶ 录音待开始 ─点右─▶ 录音中 ─点右─▶ 识别中 ─▶ 键盘态
     录音是纯模拟，不调用麦克风、不申请权限 —— 演示站要任何机器都能演。
     接真实 ASR 时替换 RECOGNIZED 与 RECOGNIZE_MS 两处即可，状态机不动。
     ---------------------------------------------------------------------- */
  var RECOGNIZED = '长江经济带的区域协调发展，有哪些代表性研究成果？';
  var RECOGNIZE_MS = 1200;

  var mode = 'keyboard';
  var rec = 'off';
  var recTimer = null;

  function renderComposer() {
    composer.setAttribute('data-mode', mode);
    /* 图标表模式，动作由 aria-label 说清 —— 否则读屏用户听到「键盘按钮」
       会以为按下去就是在打字（§10）。 */
    modeBtn.setAttribute('aria-label', mode === 'voice' ? '切换到键盘输入' : '切换到语音录入');

    recBtn.textContent = rec === 'busy' ? '正在识别…'
                       : rec === 'on'   ? '点击结束录音'
                       :                  '点击开始录音';
    recBtn.setAttribute('data-rec', rec === 'on' ? 'on' : 'off');
    recBtn.setAttribute('aria-pressed', String(rec === 'on'));
    recBtn.disabled = (rec === 'busy');
    if (rec === 'busy') recBtn.setAttribute('aria-busy', 'true');
    else recBtn.removeAttribute('aria-busy');

    /* 发送钮跟着模式显隐（录音态收起）。放这里而不是各按钮自己管 ——
       renderComposer 是所有输入条状态的唯一入口。 */
    renderSend();
    /* 切到录音态时停止播报：接下来要录用户说话，两路声音会打架。
       切回键盘态不重启 —— 「不打断」指的是发新消息，不是切输入方式。 */
    if (mode === 'voice') stopSpeaking();
  }

  /* 左：切模式。切走时把在途的识别定时器清掉、录音态收干净 ——
     否则迟到的识别结果会写进已经切走的输入框。

     不做登录校验：本页的身份在加载时已确定（微信授权 / 手机号登录）。
     校验前移后各操作点不再重复拦，登录一处的规则只写一次。 */
  modeBtn.addEventListener('click', function () {
    if (recTimer) { clearTimeout(recTimer); recTimer = null; }
    rec = 'off';
    mode = (mode === 'voice') ? 'keyboard' : 'voice';
    renderComposer();
    /* 回键盘态把光标送回输入框：已输入的文字不丢，可接着改 */
    if (mode === 'keyboard') input.focus();
  });

  /* 右：录音开关。点一下录，再点一下结束 → 识别中 → 转文字填入输入框 */
  recBtn.addEventListener('click', function () {
    if (rec === 'busy') return;

    if (rec === 'off') {
      /* 开始录音前确认身份 —— 录音是「需要账号」的能力。
         拦在这里而不是切到语音态时：切模式只是换个输入方式，
         真正要用语音是在按下这个开始录音的瞬间。
         与首页录音钮、发送提问同一口径，都走 Auth.require。
         微信端直接放行（身份由加载时的公众号授权给）。 */
      Auth.require(function () {
        rec = 'on';
        renderComposer();
      });
      return;
    }

    /* 结束录音 → 识别中 */
    rec = 'busy';
    renderComposer();

    recTimer = setTimeout(function () {
      recTimer = null;
      /* 转成文字填入输入框（不直接发送 —— 识别有误差，交给用户确认修改），
         自动回键盘态。演示站填固定文案，接真实 ASR 时替换这一行。 */
      input.value = RECOGNIZED;
      mode = 'keyboard';
      rec = 'off';
      /* renderComposer 会调 renderSend，输入文字已经写进去了，发送钮会一起刷亮 */
      renderComposer();
      input.focus();
      /* 光标置于末尾，方便直接改 */
      input.setSelectionRange(input.value.length, input.value.length);
    }, RECOGNIZE_MS);
  });

  renderComposer();

  /* 提示词位。放在 renderComposer 之后：pickPrompt 在切模式时要调它。
     带 ?q= 进来时首条消息会立刻让欢迎卡让位，enterConversation 会清掉定时器。 */
  buildPrompts();

  /* ---- 登录态 ---- */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2000);
  }
  Auth.onToast(toast);

  /* 环境分流 + 加载时授权。
     微信端：发起授权；非微信端：什么都不做，登录层等用户首次触发动作时再弹。
     注意这里**不**给 chat 页打 .is-wx —— 那个类只管首页底部动作区的切换。 */
  if (Auth.isWeChat()) Auth.boot();

  /* 顶栏头像：未登录时是登录入口，已登录时进账户页。
     href 恒为账户页，登录后再点自然过去，不会又弹一次登录层。 */
  document.getElementById('btn-account').addEventListener('click', function (e) {
    if (Auth.isLoggedIn()) return;      /* 放行 href */
    e.preventDefault();
    Auth.open(function (user) { if (user) location.href = './account.html?from=chat'; });
  });

  /* ---- 顶栏两个动作：新建对话 / 历史 ----
     二者都是导航，未登录都先弹登录层，登录后再执行原动作。

     「新建」的状态全在内存里（刷新即重置，没有可清的服务端数据），
     所以它就是跳到不带参数的 chat.html。
     用 location.replace 不留历史记录：否则从已有多轮的会话点「新建」，
     按返回会回到刚才那页，看着像新建失败。 */
  document.getElementById('btn-new').addEventListener('click', function (e) {
    e.preventDefault();
    Auth.require(function () { location.replace('./chat.html'); });
  });

  /* 历史是 <a href>：地址从元素自身读，不在脚本里另抄一份，
     免得将来改了链接而忘了改这里。 */
  var histLink = document.querySelector('.docpage__hist');
  histLink.addEventListener('click', function (e) {
    if (Auth.isLoggedIn()) return;      /* 放行 href */
    e.preventDefault();
    var href = histLink.getAttribute('href');
    Auth.require(function () { location.href = href; });
  });

  /* 转屏 / 拉窗口后顶栏可用宽度变了，标题要按新宽度重算。
     存原始问句、重算时再截 —— 不能拿已经截过的字符串回炉。
     用 rAF 合帧：resize 一次能连发几十个事件，量一次就够了。 */
  var titleSrc = '';
  var fitPending = 0;
  window.addEventListener('resize', function () {
    if (fitPending) return;
    fitPending = requestAnimationFrame(function () {
      fitPending = 0;
      if (titleSrc) title.textContent = fitTitle(titleSrc);
      else measureTitleWidth();   /* 空对话也要跟上，免得标题盒宽度过期 */
    });
  });

  /* 空对话也要先把标题盒宽度量出来，否则「新对话」会挤在 0 宽里 */
  measureTitleWidth();

  /* ---- 入口：有首条提问就发出去；没有则是新建空对话 ----
     文本有两个来源，sessionStorage 优先：
     首页跳过来时把文本写进了 skl.pendingQ，因为 ?q= 会被中间层改掉
     （干净 URL 的 301 会丢整条 query，微信 WebView 也可能重写 URL）。
     直接粘贴带参链接、或脚本在首页没跑起来时，回退到 ?q=。
     读完立刻删——它是「待发的一条」，不是历史记录，留着会让下次进来重发。 */
  var q = '';
  try {
    q = (sessionStorage.getItem('skl.pendingQ') || '').trim();
    sessionStorage.removeItem('skl.pendingQ');
  } catch (err) { /* 无痕模式等，忽略 */ }
  if (!q) {
    try { q = (new URLSearchParams(location.search).get('q') || '').trim(); } catch (err2) { q = ''; }
  }

  if (q) {
    send(q);
  }
  /* 不带 q 则是新建空对话：标题「新对话」，不预置任何消息 */
})();
</script>
</body>
</html>
